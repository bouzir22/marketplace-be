stages:
  - build
  - test

build-be:
  stage: build
  script:
    - mvn clean install

test-be:
  stage: test

  script:
    # Build application
    - mvn clean package

    # Start Spring Boot app in background
    - java -jar target/*.jar &

    # Wait few seconds for app startup
    - sleep 20

    # Call API endpoint
    - curl http://localhost:8080/hello

    # Optional: fail pipeline if API is not reachable
    - curl --fail http://localhost:8080/api/health

    # Copy generated jar
    - cp target/*.jar backend-dev-${CI_COMMIT_SHA}.jar

  artifacts:
    paths:
      - backend-dev-${CI_COMMIT_SHA}.jar