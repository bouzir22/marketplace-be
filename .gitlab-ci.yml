stages:
  - build
  - dockerize
  - push
  - deploy

variables:
  MAVEN_CLI_OPTS: "-s .m2/settings.xml --batch-mode"
  DOCKER_IMAGE: "$CI_REGISTRY_IMAGE:${CI_COMMIT_SHORT_SHA}"
  SERVICE_NAME: springboot-app
  CONTAINER_PORT: 8080
  HOST_PORT: 8080

cache:
  paths:
    - .m2/repository
 
 

build:
  stage: build
  image: maven:3.9.9-eclipse-temurin-17
  script:
    - mvn clean package -DskipTests
  artifacts:
    paths:
      - target/*.jar
    expire_in: 1 week

dockerize:
  stage: dockerize
  image: maven:3.9.6-eclipse-temurin-17
  variables:
    REGISTRY_USERNAME: "$CI_REGISTRY_USER"
    REGISTRY_PASSWORD: "$CI_REGISTRY_PASSWORD"
  script:
    - mvn compile com.google.cloud.tools:jib-maven-plugin:3.4.4:build  -Djib.to.auth.username=${CI_REGISTRY_USER} -Djib.to.auth.password=${CI_REGISTRY_PASSWORD} -Djib.to.image=${CI_REGISTRY_IMAGE}/backend:latest
  only:
    - merge_requests
    - main

push_image:
  stage: push
  image: maven:3.9.9-eclipse-temurin-17
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" "$CI_REGISTRY" --password-stdin
    - mvn $MAVEN_CLI_OPTS compile jib:build -Dimage=$DOCKER_IMAGE
  only:
    - main

deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client bash
  script:
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts
    - |
      ssh -i ~/.ssh/id_rsa $VM_USER@$VM_HOST /bin/bash -s <<'EOF'
      set -e
      # login to registry
      echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" "$CI_REGISTRY" --password-stdin

      # pull latest image
      docker pull $CI_REGISTRY_IMAGE:${CI_COMMIT_SHORT_SHA}

      # stop previous container (ignore failure)
      docker stop $SERVICE_NAME || true
      docker rm $SERVICE_NAME || true

      # run new container (customize env, volumes, options)
      docker run -d \
        --name $SERVICE_NAME \
        --restart unless-stopped \
        -p ${HOST_PORT}:${CONTAINER_PORT} \
        $CI_REGISTRY_IMAGE:${CI_COMMIT_SHORT_SHA}

      # optional: cleanup older images (simple)
      docker image prune -af || true
      EOF
  only:
    - main
