stages:
  - build
  - dockerize
  - deploy

variables:
  MAVEN_CLI_OPTS: "-s .m2/settings.xml --batch-mode"
  DOCKER_IMAGE: "$CI_REGISTRY_IMAGE:${CI_COMMIT_SHORT_SHA}"
  SERVICE_NAME: springboot-app
  CONTAINER_PORT: 8080
  HOST_PORT: 8080

cache:
  paths:
    - .m2/repository
 
 

build:
  stage: build
  image: maven:3.9.9-eclipse-temurin-17
  script:
    - mvn clean package -DskipTests
  artifacts:
    paths:
      - target/*.jar
    expire_in: 1 week

dockerize:
  stage: dockerize
  image: maven:3.9.6-eclipse-temurin-17
  variables:
    REGISTRY_USERNAME: "$CI_REGISTRY_USER"
    REGISTRY_PASSWORD: "$CI_REGISTRY_PASSWORD"
  script:
    - mvn compile com.google.cloud.tools:jib-maven-plugin:3.4.4:build  -Djib.to.auth.username=${CI_REGISTRY_USER} -Djib.to.auth.password=${CI_REGISTRY_PASSWORD} -Djib.to.image=${CI_REGISTRY_IMAGE}/backend:latest
  only:
    - merge_requests
    - main


deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client bash
script:
    # Use a simpler single-line command for better YAML handling of the Here Document.
    # The 'set -e' is moved inside the remote script to ensure the whole block fails on the first error.
    - |
      ssh -i ~/.ssh/id_rsa "${VM_USER}@${VM_HOST}" /bin/bash -s <<'EOF'
      
      set -e # Exit immediately if any command fails
      
      echo "--- 🔑 Logging into Container Registry ---"
      # Log in to registry using stdin for password to keep it out of shell history
      echo "${CI_REGISTRY_PASSWORD}" | docker login -u "${CI_REGISTRY_USER}" "${CI_REGISTRY}" --password-stdin
      
      echo "--- ⬇️ Pulling Latest Image ---"
      # Pull latest image using the short SHA for specificity
      DEPLOY_IMAGE="${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}"
      docker pull "${DEPLOY_IMAGE}"
      
      echo "--- 🔄 Stopping and Removing Old Container ---"
      # Stop and remove previous container (ignore failure if it doesn't exist)
      docker stop "${SERVICE_NAME}" 2>/dev/null || true
      docker rm "${SERVICE_NAME}" 2>/dev/null || true
      
      echo "--- ⬆️ Running New Container ---"
      # Run new container (customize env, volumes, options)
      docker run -d \
        --name "${SERVICE_NAME}" \
        --restart unless-stopped \
        -p "${HOST_PORT}:${CONTAINER_PORT}" \
        "${DEPLOY_IMAGE}"
        
      echo "Container ${SERVICE_NAME} deployed successfully."

      echo "--- 🧹 Cleaning Up Docker Images ---"
      # Cleanup older images (only remove dangling images)
      docker image prune -f || true 
      # OPTIONAL: Use 'docker image prune -a' only if disk space is critical and you understand the risks.
      
      EOF
  only:
    - main
