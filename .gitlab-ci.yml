stages:
  - build
  - dockerize
  - deploy

variables:
  MAVEN_CLI_OPTS: "-s .m2/settings.xml --batch-mode"
  DOCKER_IMAGE: "$CI_REGISTRY_IMAGE:${CI_COMMIT_SHORT_SHA}"
  SERVICE_NAME: springboot-app
  CONTAINER_PORT: 8080
  HOST_PORT: 8080

cache:
  paths:
    - .m2/repository
 
 

build:
  stage: build
  image: maven:3.9.9-eclipse-temurin-17
  script:
    - mvn clean package -DskipTests
  artifacts:
    paths:
      - target/*.jar
    expire_in: 1 week

dockerize:
  stage: dockerize
  image: maven:3.9.6-eclipse-temurin-17
  variables:
    REGISTRY_USERNAME: "$CI_REGISTRY_USER"
    REGISTRY_PASSWORD: "$CI_REGISTRY_PASSWORD"
  script:
    - mvn compile com.google.cloud.tools:jib-maven-plugin:3.4.4:build  -Djib.to.auth.username=${CI_REGISTRY_USER} -Djib.to.auth.password=${CI_REGISTRY_PASSWORD} -Djib.to.image=${CI_REGISTRY_IMAGE}/backend:latest
  only:
    - merge_requests
    - main


deploy:

  stage: deploy

  image: alpine:latest

  before_script:

    - apk add --no-cache openssh-client bash

  script:
  - mkdir -p ~/.ssh
  
  # Decode base64 key
  - echo "$SSH_PRIVATE_KEY" | base64 -d > ~/.ssh/id_rsa
  - chmod 600 ~/.ssh/id_rsa
  
  # Debug: Check key format
  - echo "Key header:"; head -n 1 ~/.ssh/id_rsa
  - echo "Key footer:"; tail -n 1 ~/.ssh/id_rsa
  - echo "Key line count:"; wc -l ~/.ssh/id_rsa
  
  # Validate SSH key
  - ssh-keygen -y -f ~/.ssh/id_rsa > /dev/null || { echo "Invalid SSH key format"; exit 1; }
  
  # Add host key
  - ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts
  
  # Debug info
  - echo "Attempting to connect to $VM_USER@$VM_HOST"
  
  # Test connection
  - ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=accept-new "$VM_USER@$VM_HOST" "echo 'Successfully connected to VM'"
  
  # Deploy
  - |
    ssh -i ~/.ssh/id_rsa "$VM_USER@$VM_HOST" /bin/bash -s <<EOF
    set -e
    
    echo "=== Connected to VM: \$(hostname) ==="
    echo "=== Current user: \$(whoami) ==="
    echo "=== Starting deployment ==="
    
    echo "Logging into Docker registry..."
    echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" "$CI_REGISTRY" --password-stdin
    
    echo "Pulling image: $CI_REGISTRY_IMAGE:latest"
    docker pull $CI_REGISTRY_IMAGE/backend:latest
 
    
    echo "Starting new container: $SERVICE_NAME"
    docker run -d \
      --name be \
      --restart unless-stopped \
      -p 8080:8080 \
      $CI_REGISTRY_IMAGE:latest
    
    echo "Container started successfully"
    docker ps | grep $SERVICE_NAME
    
    echo "Cleaning up old images..."
    docker image prune -af || true
    
    echo "=== Deployment completed successfully ==="
    EOF
