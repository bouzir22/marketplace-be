spring.application.name=backend

spring.datasource.url=jdbc:postgresql://postgres_db/_ach_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate properties
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Optional: Connection pool settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

# Elasticsearch configuration
spring.elasticsearch.uris=${ELASTICSEARCH_URIS:http://elasticsearch:9200}
spring.elasticsearch.username=${ELASTICSEARCH_USERNAME:}
spring.elasticsearch.password=${ELASTICSEARCH_PASSWORD:}

# AWS S3 configuration for image storage
aws.s3.enabled=${S3_ENABLED:false}
aws.s3.access-key=${S3_ACCESS_KEY:}
aws.s3.secret-key=${S3_SECRET_KEY:}
aws.s3.bucket=${S3_BUCKET:marketplace-images}
aws.s3.region=${S3_REGION:us-east-1}
aws.s3.endpoint=${S3_ENDPOINT:}

# File upload settings
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB